<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0f3">
<title>Keptly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Gloock&family=Give+You+Glory&family=Special+Elite&family=Caveat:wght@500;700&family=Permanent+Marker&family=Cormorant+Garamond:ital,wght@1,500;1,700&family=Shadows+Into+Light&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE soft, slow, honest: a character creator for caring, where the gift is a plant you raised
   IDEA a florist's back room: a paper-cutout plant grows in a pot you paint yourself, then travels with a card you draw
   PICTURE the pot on a torn cream sheet, cut-out plant jittering like hand-moved paper; drawing studio in the same pale glass
   COLOUR pale studio grey, white glass, logo green for the brand, soft periwinkle for actions, rose for love
   TYPE Onest UI, Gloock for names and meanings, Give You Glory / Special Elite for handwritten and typed cards
   LAYOUT mobile first: stage on top, thumb dock, bottom tab bar; from 1021px an inZOI-style three columns */
:root{color-scheme:light;--ink:#30343b;--soft:#6b717b;--mute:#959aa3;--line:rgba(48,52,59,.14);--glass:rgba(255,255,255,.62);--white:#fff;
--acc:#8fb3ea;--accInk:#3d63a6;--leaf:#5f8559;--rose:#d9567a;--ok:#5f9b62;--bad:#c4573f;--floor1:#f3f4f6;--floor2:#d9dce2;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.5 Onest,system-ui,sans-serif;font-synthesis:none;background:radial-gradient(120% 90% at 50% 30%,var(--floor1) 0%,#e6e8ec 55%,var(--floor2) 100%);overflow-x:clip}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accInk);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit;text-decoration:none}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lang{display:inline-flex;background:rgba(255,255,255,.78);border-radius:99px;padding:3px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.lang button{border:0;background:none;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--soft);letter-spacing:.03em;min-height:30px}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.rb{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.8);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06);color:var(--ink)}
.rb[aria-pressed=false]{color:var(--mute)}
.rb:active{transform:scale(.94)}

/* ---------- welcome ---------- */
#welcome{position:fixed;inset:0;z-index:50;background:#1d211a;display:none;overflow:hidden}
#welcome.on{display:block}
#welcome video,#welcome .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#welcome .txt{position:absolute;left:12px;right:12px;bottom:max(14px,calc(var(--sb) + 8px));padding:34px 24px 22px;background:#fbf6ea;color:#3e3a35;transform:rotate(-1.2deg);box-shadow:0 30px 60px rgba(20,16,10,.38),0 4px 10px rgba(20,16,10,.2);clip-path:polygon(0 2%,12% 0,30% 1.5%,52% 0,73% 1.5%,92% 0,100% 2.5%,99% 28%,100% 55%,98.8% 80%,100% 98%,78% 100%,56% 98.6%,33% 100%,12% 98.5%,0 100%,1.2% 70%,0 42%);animation:settle .9s steps(6,end) both}
@keyframes settle{from{opacity:0;transform:translateY(28px) rotate(-3deg)}to{opacity:1;transform:rotate(-1.2deg)}}
#welcome .txt::before{content:"";position:absolute;left:38%;top:-6px;width:96px;height:26px;background:rgba(214,203,170,.85);transform:rotate(-3deg)}
#welcome .tl{font:400 clamp(34px,9.6vw,46px)/1.05 'Give You Glory',cursive;color:#4f6b49;margin:0 0 18px;text-wrap:balance}
#welcome p.d{font-size:14.5px;color:#5a554c;margin:0 0 28px;line-height:1.6}
#welcome .big{background:var(--leaf);box-shadow:0 6px 16px rgba(60,90,55,.35);width:100%;justify-content:center;gap:12px;line-height:1;padding:0 24px;min-height:56px}
#welcome .big .ic{width:20px;height:20px;stroke-width:2}
#welcome .big:hover{background:#527a4c}
#welcome .wt{position:absolute;left:14px;right:14px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;z-index:3}
@media(prefers-reduced-motion:reduce){#welcome .txt{animation:none}}

/* ---------- shell (mobile first) ---------- */
.app{min-height:100dvh;display:flex;flex-direction:column;padding:0 14px calc(168px + var(--sb))}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) 0 8px;margin:0 -14px;padding-left:14px;padding-right:14px;background:linear-gradient(#eceef2 88%,rgba(236,238,242,0))}
.crumb{display:flex;align-items:center;gap:10px;font-size:16px;white-space:nowrap}
.crumb .back{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center}
.crumb .back .ic{width:17px;height:17px}
.crumb .logo{height:24px;width:auto;display:block;flex:none}
.crumb .sep,.crumb .sec{display:none}
.tools{display:none}
.right{display:flex;gap:8px;align-items:center}
.right .lang,.right .daypill,.right .share{display:none}
.daypill{align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--soft)}
.share{align-items:center;gap:8px;background:var(--white);border:0;border-radius:99px;padding:8px 16px 8px 10px;font-weight:600;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.share .dot{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#c9b6f2,#8fb3ea);display:grid;place-items:center;color:#fff}
.share .dot .ic{width:14px;height:14px}
.main{display:flex;flex-direction:column;gap:14px;width:100%;max-width:640px;margin:0 auto;padding-top:4px}
.center{order:1}.rp{order:2}.lp{order:3}
body[data-view=tienda] .lp{order:2}body[data-view=tienda] .rp{order:3}
.side .sh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:16px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sh .ic{color:var(--soft)}
.blk{margin-bottom:20px}
.row2{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:10px;margin:10px 0;font-size:14px;color:var(--soft)}
.field{height:44px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.7);padding:0 16px;font:inherit;font-size:16px;color:var(--ink);width:100%}
.field::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.spc{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spc img{width:100%;height:100%;object-fit:cover;display:block}
.spc[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 3px rgba(143,179,234,.35)}
.lvl{display:flex;gap:5px}.lvl i{width:22px;height:6px;border-radius:3px;background:var(--line)}.lvl i.on{background:var(--ink)}
.trait{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:start}
.trait .card{width:92px;aspect-ratio:1/1;border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px #fff,0 6px 16px rgba(0,0,0,.12);background:#ddd}
.trait .card img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.trait .k{font-size:13px;color:var(--soft)}
.trait .t{font:400 24px/1.1 Gloock,Georgia,serif;margin:4px 0 8px;text-wrap:balance}
.trait .tags{font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;gap:4px 12px}
.needs{display:grid;gap:11px}
.need{display:grid;grid-template-columns:20px 58px minmax(0,1fr) 78px;align-items:center;gap:10px;font-size:13px;font-weight:500}
.need .st{text-align:right;color:var(--soft);white-space:nowrap}.need .st.bad{color:var(--bad);font-weight:600}
.bar{height:6px;border-radius:3px;background:rgba(48,52,59,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .5s ease,background .3s}
.note{font-size:13px;color:var(--soft);line-height:1.5}
.growbar{display:grid;gap:4px;margin-top:14px}.growbar .bar{height:8px}
/* mobile: only the essentials of the left panel, per view */
body[data-view=vivero] .lp .blk:not(#needsBlk),body[data-view=tarjeta] .lp,body[data-view=enviar] .lp{display:none}
body[data-view=vivero] .need.nx{display:none}
body[data-view=tienda] .lp #spcBlk,body[data-view=tienda] .lp #aboutBlk{display:none}
body[data-view=tienda] .lp #saysBlk{display:block}
body[data-view=tienda] .lp #saysBlk .sh{display:flex}
body[data-view=tienda] .lp .sh{display:none}

/* ---------- stage ---------- */
.stage{position:relative;height:clamp(310px,46dvh,470px);container-type:size}
.floor{position:absolute;left:50%;bottom:6cqh;width:56%;height:6cqh;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(40,44,52,.22),rgba(40,44,52,0))}
.pile{position:absolute;left:50%;bottom:10cqh;width:min(96cqw,calc(80cqh / 1.14));aspect-ratio:1/1.14;transform:translateX(-50%);container-type:inline-size;--cut:drop-shadow(.5cqw 0 0 #fffdf6) drop-shadow(-.5cqw 0 0 #fffdf6) drop-shadow(0 .5cqw 0 #fffdf6) drop-shadow(0 -.5cqw 0 #fffdf6) drop-shadow(0 1.3cqw 1.5cqw rgba(30,32,38,.22))}
.sheet,.sheet2{position:absolute;left:5cqw;right:5cqw;top:16cqw;bottom:2cqw;clip-path:polygon(2% 4%,18% 1.5%,36% 3.5%,55% 0.5%,74% 3%,92% 1%,99% 7%,97.5% 30%,100% 52%,98% 76%,99% 97%,80% 99.5%,60% 98%,41% 100%,22% 98%,3% 99.5%,0 80%,2% 55%,0 30%)}
.sheet{background:linear-gradient(170deg,#fffdf8,#f6f1e6);transform:rotate(-1.1deg)}
.sheet2{background:rgba(40,44,52,.16);transform:translate(1cqw,1.6cqw) rotate(-1.1deg);filter:blur(.8cqw)}
.potimg{position:absolute;width:50cqw;left:25cqw;bottom:3cqw;filter:hue-rotate(var(--ph,0deg)) brightness(var(--pb,1)) var(--cut);display:block}
.deco{position:absolute;left:25cqw;bottom:3cqw;width:50cqw;aspect-ratio:760/695;pointer-events:none;overflow:visible}
.plant{position:absolute;inset:0;transform-origin:50cqw 73cqw;filter:var(--cut)}
.plant img{position:absolute;display:block;opacity:0;max-width:none}
.plant.fsick img{filter:sepia(calc(var(--ill,0)*.6)) saturate(calc(1 - var(--ill,0)*.45)) hue-rotate(calc(var(--ill,0)*-12deg)) brightness(calc(1 - var(--ill,0)*.08))}
.plant.dead{filter:var(--cut) grayscale(.85) brightness(.82) sepia(.35)}
.plant.dead img{filter:grayscale(.9) sepia(.5) brightness(.78)}
.leaf{position:absolute;left:60cqw;bottom:47cqw;width:24cqw;transform-origin:30% 100%;filter:var(--cut);display:none;z-index:3}
.leaf img{display:block;width:100%}
.leaf.on{display:block;animation:leafin .55s steps(5,end) both,leafsway 1.3s steps(2,end) .6s infinite}
@keyframes leafin{0%{transform:translateY(-30cqw) rotate(40deg);opacity:0}40%{opacity:1}100%{transform:rotate(12deg);opacity:1}}
@keyframes leafsway{0%{transform:rotate(12deg)}50%{transform:rotate(14.5deg)}}
@keyframes pop{0%{opacity:0;transform:translateY(-16px) scale(.92) rotate(var(--rot,0deg))}100%{opacity:1;transform:rotate(var(--rot,0deg))}}
.tape{position:absolute;width:30%;height:9%;left:35%;top:-3.5%;background:rgba(236,228,206,.78);transform:rotate(-4deg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.memo{--rot:5deg;position:absolute;right:-4%;top:14%;background:#fff8d9;padding:10px 14px 12px;font:400 21px/1.2 'Give You Glory',cursive;color:#5a4a2a;transform:rotate(5deg);box-shadow:0 6px 12px rgba(0,0,0,.12);max-width:46%;display:none}
.memo.on{display:block;animation:pop .5s steps(4,end) both}
.memo::before{content:"";position:absolute;left:30%;top:-10px;width:40%;height:16px;background:rgba(236,228,206,.85);transform:rotate(-3deg)}
.tag{--rot:-7deg;position:absolute;left:-7%;bottom:15%;background:#fffdf8;border-radius:6px;padding:12px 40px 10px 24px;min-width:42%;max-width:62%;transform:rotate(-7deg);box-shadow:0 8px 16px rgba(0,0,0,.14);display:none;font:400 26px/1.15 'Give You Glory',cursive;color:#3e3a35;z-index:4}
.tag.on{display:block;animation:pop .5s steps(4,end) both}
.tag.f-serif{font:400 19px/1.2 Gloock,Georgia,serif}.tag.f-maq{font:400 16px/1.25 'Special Elite','Courier New',monospace}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:9px;height:9px;margin-top:-5px;border-radius:50%;background:var(--floor2);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.tag small{display:block;font:500 12px Onest,sans-serif;color:var(--soft);margin-bottom:2px;letter-spacing:.02em}
.tag .ti{position:absolute;right:9px;top:9px;width:24px;height:24px;color:var(--rose);opacity:.9;display:none}
.tag.hs .ti{display:block}
.nightveil{position:absolute;inset:0;border-radius:40px;background:radial-gradient(70% 60% at 50% 45%,rgba(70,86,140,0),rgba(70,86,140,.22));opacity:0;transition:opacity 1.6s;pointer-events:none}
.nightveil.on{opacity:1}
.fx{position:absolute;left:50%;top:22%;width:60%;height:50%;transform:translateX(-50%);pointer-events:none}
.fx span{position:absolute;opacity:0}
.fx.w span{animation:fall 1s ease-in both}.fx.a span{animation:rise 1.4s ease-out both}.fx.c span{animation:rise 1.2s ease-out both}
.fx.l{background:radial-gradient(closest-side,rgba(255,214,120,.55),rgba(255,214,120,0));animation:glow 1.4s ease both}
@keyframes fall{0%{opacity:0;transform:translateY(-30px)}25%{opacity:1}100%{opacity:0;transform:translateY(120px)}}
@keyframes rise{0%{opacity:0;transform:translateY(30px) scale(.8)}30%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.1)}}
@keyframes glow{0%,100%{opacity:0}40%{opacity:1}}
.caption{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:13px;color:var(--soft);line-height:1.3}
.caption b{display:block;font:400 21px/1.15 Gloock,Georgia,serif;color:var(--ink);margin-bottom:1px}
.say{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(520px,100%);text-align:center;font:400 24px/1.15 'Give You Glory',cursive;color:#3e4149;text-wrap:balance;z-index:3;background:rgba(255,255,255,.88);border-radius:16px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.say:empty{display:none}

/* ---------- dock ---------- */
.dock{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dock.on{display:grid}
.dock.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dock button{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;border:0;background:rgba(255,255,255,.82);border-radius:18px;padding:10px 6px 10px;font-weight:600;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.08);min-height:68px}
.dock button:active{transform:scale(.97)}
.dock .top2{display:flex;flex-direction:column;align-items:center;gap:2px}
.dock .ic{width:24px;height:24px}
.dock kbd{display:none}
.dock .m{display:block;height:5px;border-radius:3px;background:rgba(48,52,59,.12);overflow:hidden}
.dock .m b{display:block;height:100%;border-radius:3px;background:var(--mc,var(--ok));transition:width .4s}
.dock .sub{display:none;font-size:11px;font-weight:500;color:var(--soft)}
.dock button.low{background:#fff;box-shadow:0 0 0 2px var(--bad),0 4px 14px rgba(196,87,63,.25);animation:nudge 1.1s ease-in-out infinite}
.dock button.low .m b{background:var(--bad)}
.dock button.low .sub{color:var(--bad);font-weight:600}
@keyframes nudge{50%{transform:translateY(-4px)}}
.dock .n{position:absolute;top:-6px;right:-2px;width:20px;height:20px;border-radius:50%;background:#a58bd6;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* ---------- panels ---------- */
.seg{display:flex;gap:4px;background:rgba(255,255,255,.55);border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 6px;font-size:13px;color:var(--soft);font-weight:500;white-space:nowrap;min-height:40px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{background:rgba(255,255,255,.45);border-radius:18px;padding:14px}
.gh{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.gh span{font-weight:400;font-size:12px;color:var(--soft)}
.lab{font-size:13px;color:var(--soft);font-weight:500;margin:18px 0 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab:first-child{margin-top:0}
.lab em{font-style:normal;font-weight:400;color:var(--mute);font-size:12px}
.circles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.cir{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:12px;color:var(--soft);text-align:center}
.cir .o{width:100%;max-width:84px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);border:2px solid transparent;position:relative}
.cir .o img{width:100%;height:100%;object-fit:cover;display:block}
.cir[aria-pressed=true] .o{border-color:var(--acc);box-shadow:0 0 0 4px rgba(143,179,234,.3)}
.cir.locked .o img{filter:grayscale(1) blur(2px) opacity(.5)}
.cir .lock{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft)}
.cir b{font-weight:600;color:var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--acc),0 0 0 5px rgba(143,179,234,.28)}
.sw .rainbow{background:conic-gradient(#f66,#fd6,#8e6,#6de,#68f,#d6f,#f66)}
.sw .auto{background:linear-gradient(135deg,#fff 48%,#d33 48% 52%,#fff 52%);font-size:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.65);border-radius:99px;padding:9px 15px;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.opt[aria-pressed=true]{background:#fff;border-color:var(--acc);color:var(--accInk);font-weight:600}
.opt.mano{font:400 17px/1 'Give You Glory',cursive}.opt.serif{font:400 15px/1 Gloock,Georgia,serif}.opt.maq{font:400 13px/1 'Special Elite','Courier New',monospace}
.stkb{width:44px;height:44px;border-radius:50%;border:1px dashed var(--mute);background:rgba(255,255,255,.6);display:grid;place-items:center;color:var(--rose);padding:0}
.stkb[aria-pressed=true]{background:#fff;border-style:solid;border-color:var(--acc)}
.stkb.none{color:var(--mute);font-size:11px}
.slide{display:grid;grid-template-columns:54px minmax(0,1fr);align-items:center;gap:10px;font-size:13px;color:var(--soft);margin:8px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--trk,rgba(48,52,59,.15))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--trk,rgba(48,52,59,.15))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.drawcta{width:100%;display:flex;align-items:center;gap:14px;border:0;border-radius:18px;padding:14px 16px;background:var(--ink);color:#fff;text-align:left;margin-top:18px;min-height:64px}
.drawcta .ic{width:26px;height:26px}
.drawcta b{display:block;font-size:15px}
.drawcta small{display:block;font-size:12px;opacity:.7}
.drawcta:active{transform:scale(.985)}
.minibar{height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}.minibar i{display:block;height:100%;background:#fff;border-radius:2px}
.form{display:grid;gap:12px}

function ac(){
 if(!SND)return null;
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}

function tone(f,d,type,vol,delay,to){
 const c=ac();if(!c)return;const t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.12,t0+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0001,t0+d);
 o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d+.05);
}
let NB=null;
function noise(d,ft,f,vol,delay,q,to){
 const c=ac();if(!c)return;
 if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate);const x=NB.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1}
 const t0=c.currentTime+(delay||0),s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
 s.buffer=NB;s.loop=true;fl.type=ft;fl.frequency.setValueAtTime(f,t0);if(to)fl.frequency.exponentialRampToValueAtTime(to,t0+d);fl.Q.value=q||1;
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.1,t0+Math.min(.04,d/3));g.gain.exponentialRampToValueAtTime(.0001,t0+d);
 s.connect(fl).connect(g).connect(c.destination);s.start(t0);s.stop(t0+d+.05);
}

 if(v.dataset.s!==s){v.dataset.s=s;v.src=s;v.poster=p;if(v===wV)$('wPoster').src=p}
 v.muted=true;v.defaultMuted=true;
 if(!still.matches){const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{})}
}
const vidSync=()=>{setVideo(wV,$('welcome').classList.contains('on'));setVideo(gV,$('gift').classList.contains('on'))};
if(mq.addEventListener)mq.addEventListener('change',()=>{wV.dataset.s='';gV.dataset.s='';vidSync()});

/* ---------- gift / preview ---------- */
let flipT=null;
function playFlip(){
 clearTimeout(flipT);let i=0;if(!SC.gift)SC.gift=Scene($('gPile'));
 const g=gift,sc=SC.gift,tagText=t('forX',g.t||'…');
 const cap=()=>{$('gCap').innerHTML=`<b>${esc(t('stages')[i])}</b>${i===6?esc((g.nm||FLt(g.f).n)+' · '+vName(g.f,g.v)+' · '+t('gInPot')):'&nbsp;'}`};
 sc.pot(g,potLabel(g.nm,g.t));sc.show(g.f,0,false,g.v);sc.sick(false,0);sc.tag(null,PAPERS[g.p],g.tf,g.ts,TCOL[g.cc],g.gx,g.gy);cap();
 const step=()=>{i++;sc.show(g.f,i,undefined,g.v);cap();sfx(i===6?'bloom':'grow');
  if(i===6){setTimeout(()=>sc.tag(tagText,PAPERS[g.p],g.tf,g.ts,TCOL[g.cc],g.gx,g.gy),900);return}
  flipT=setTimeout(step,1600)};
 flipT=setTimeout(step,700);
}
function renderGift(){
 const g=gift,v=FLt(g.f),who=g.d||t('someone');
 $('gKick').textContent=BRAND+' · '+t('gKick');
 $('gTitle').textContent=g.t&&g.t!=='…'?t('gTitle2',g.t):t('gTitle');
 $('gStory').textContent=t('gStory',who,v.art,g.nm,g.n,g.k);
 $('env').innerHTML=cardHTML(g)+`<button class="envx" type="button"><svg class="ic"><use href="#i-x"/></svg>${esc(t('close'))}</button>`;
 $('env').classList.remove('on');
 $('ownWrap').style.display=previewing?'none':'';
 playFlip();
}

/* ---------- routing ---------- */
function route(){
 const h=location.hash.slice(1);
 let g=null,pv=false;
 if(h==='vista'){if(S.mode==='card'||S.mode==='sent'){g=mkGift();pv=true}}
 else g=dec(h);
 gift=g;previewing=pv;
 $('gift').classList.toggle('on',!!gift);$('gift').classList.toggle('preview',pv);$('app').style.display=gift?'none':'';
 $('welcome').classList.toggle('on',!gift&&!S.seen);
 if(ST.on)closeStudio();
 if(gift){
  if(!pv){let st='';try{st=localStorage.getItem('keptly_lang')||''}catch(e){}if(!st&&gift.l)LANG=gift.l}
  applyStatic();renderGift();vidSync();return;
 }
 if(['tienda','vivero','tarjeta','enviar'].includes(h))tab=h;
 else tab=S.mode==='shop'?'tienda':S.mode==='grow'||S.mode==='dead'?'vivero':S.mode==='card'?'tarjeta':'enviar';
 if(tab==='vivero'&&S.mode==='shop')tab='tienda';
 if(tab==='tarjeta'&&!(S.mode==='card'||S.mode==='sent'))tab=S.mode==='shop'?'tienda':'vivero';
 if(tab==='enviar'&&S.mode!=='sent')tab=S.mode==='card'?'tarjeta':S.mode==='grow'||S.mode==='dead'?'vivero':'tienda';
 applyStatic();
 if(S.mode==='dead')say(t('deadMsg'));else if(tab==='vivero'&&!$('say').textContent)say(S.sick?t('sick'):t('sayStage')[stageOf(S.g)]);
 if(tab==='tienda')say(S.mode==='shop'?'':t('alreadyCaring'));
 render(false);vidSync();window.scrollTo(0,0);
}
const go=x=>{if(location.hash.slice(1)===x)route();else location.hash=x};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const sc=e.target.closest('.scrim');
 if(sc&&e.target===sc){if(sc.id==='menuScrim')closeMenu();else closeDlg();return}
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(b.id==='stSym'){ST.sym=!ST.sym;sfx('tap');stRedraw();return}
 if(d.tl!==undefined){ST.tool=+d.tl;sfx('tap');stBuild();return}
 if(d.col!==undefined&&ST.on){ST.col=+d.col;sfx('tap');stBuild();return}
 if(d.stp!==undefined){ST.stamp=+d.stp;sfx('tap');stBuild();return}
 if(d.snd!==undefined){setSnd(!SND,true);if($('menuScrim').classList.contains('on'))openMenu();return}
 if(d.menu){closeMenu();if(d.menu==='snd')setSnd(!SND,true);else if(d.menu==='change')askChange();else if(d.menu==='home'){S.seen=false;save();route()}return}
 if(d.lang){setLang(d.lang,true);return}
 if(d.draw){sfx('tap');openStudio(d.draw);return}
 if(d.spc&&S.mode==='shop'){S.f=d.spc;sfx('tap');save();render();return}
 if(d.tab){if(b.classList.contains('lock')){sfx('tap');toast(t({vivero:'lockV',tarjeta:'lockT',enviar:'lockE'}[d.tab]));return}sfx('tab');go(d.tab);return}
 if(d.seg){seg[tab]=d.seg;sfx('tab');renderRight();renderStage();return}
 if(d.act){if(['w','l','a','c'].includes(d.act))act(d.act);return}
 if(d.pot){S.pc=d.pot;sfx('tap');save();renderStage();renderRight();return}
 if(d.deco){S.pd=d.deco;sfx('tap');save();renderStage();renderRight();return}
 if(d.pk!==undefined){S.pk=+d.pk;sfx('tap');save();renderStage();renderRight();return}
 if(d.pf!==undefined){S.pf=+d.pf;sfx('tap');save();renderStage();renderRight();return}
 if(d.pg!==undefined){S.pg=+d.pg;sfx('tap');save();renderStage();renderRight();return}
 if(d.paper){S.paper=d.paper;sfx('tap');save();renderStage();renderRight();return}
 if(d.tx!==undefined){S.tx=+d.tx;sfx('tap');save();renderRight();return}
 if(d.cc!==undefined){S.cc=+d.cc;sfx('tap');save();renderStage();renderRight();return}
 if(d.tp!==undefined){S.tp=+d.tp;sfx('tap');save();renderRight();return}
 if(d.fz!==undefined||d.al!==undefined||d.fr!==undefined||d.rd!==undefined){['fz','al','fr','rd'].forEach(k=>{if(d[k]!==undefined)S[k]=+d[k]});sfx('tap');save();renderStage();renderRight();return}
 if(d.font){S.tf=d.font;sfx('tap');save();renderStage();renderRight();return}
 if(d.stk){S.ts=d.stk;sfx('tap');save();renderStage();renderRight();return}
 if(d.inspire){const id=T[LANG].ideas,i=id.indexOf(curMsg());S.msg=id[(i+1)%id.length];sfx('tap');save();renderRight();return}
});
document.addEventListener('input',e=>{
 const s=e.target.dataset&&e.target.dataset.sl;
 if(s){S[s]=+e.target.value;save();renderStage()}
 if(e.target.id==='stSize'){ST.size=+e.target.value}
});
$('menuBtn').onclick=openMenu;
$('dlgNo').onclick=closeDlg;$('dlgOk').onclick=()=>{const cb=dlgCb;closeDlg();if(cb)cb()};
$('stClose').onclick=stAskClose;$('stDone').onclick=stDone;$('stUndo').onclick=stUndo;$('stRedo').onclick=stRedo;$('stClear').onclick=stClear;
$('enter').onclick=()=>{S.seen=true;save();sfx('tap');$('welcome').classList.remove('on');vidSync()};

$('pName').oninput=e=>{S.name=e.target.value;save();renderProfile();renderStage()};
const toggleTest=()=>{S.test=!S.test;save();startTimer();renderChrome();if(tab==='vivero')say(S.test?t('tmOn'):t('tmOff'))};
$('tTest').onclick=toggleTest;$('bTest').onclick=toggleTest;
$('tSick').onclick=()=>{if(S.mode==='grow'&&!S.sick){getSick();render();save()}};
$('tRand').onclick=()=>{if(S.mode!=='shop'){say(t('alreadyPicked'));return}S.f=pick(ORDER.filter(k=>k!==S.f));save();render()};
$('tReset').onclick=()=>startOver(false);
const toggleUI=()=>{const on=document.body.classList.toggle('hideui');$('tHide').setAttribute('aria-pressed',on)};
$('tHide').onclick=toggleUI;
$('shareBtn').onclick=()=>{if(S.mode==='sent')go('enviar');else if(S.mode==='card')go('tarjeta');else if(S.mode==='grow'||S.mode==='dead'){go('vivero');say(S.mode==='dead'?t('deadMsg'):t('mustBloom'))}else go('tienda')};
$('prevBtn').onclick=()=>go('vista');
$('pvBack').onclick=()=>go(S.mode==='sent'?'enviar':'tarjeta');
$('cta').onclick=()=>{
 if($('cta').getAttribute('aria-disabled')==='true'){say(t('notYet'));sfx('err');return}
 if(tab==='tienda'){if(S.mode==='shop'){S.mode='grow';S.sow=false;S.v=Math.floor(Math.random()*10);S.hp=100;S.w=55;S.l=55;S.a=55;S.g=0;S.day=1;S.t=0;lastWarn='';$('say').textContent='';save();startTimer();sfx('grow');go('vivero');say(t('sowHint'))}else go(S.mode==='grow'||S.mode==='dead'?'vivero':S.mode==='card'?'tarjeta':'enviar');return}
 if(tab==='vivero'){if(S.mode==='dead'){Object.assign(S,{mode:'grow',sow:false,v:Math.floor(Math.random()*10),hp:100,w:55,l:55,a:55,g:0,day:1,t:0,sick:false,cure:0,k:0,roll:Math.random()});lastWarn='';save();startTimer();render(false);say(t('replanted'));sfx('grow');return}go('tarjeta');return}
 if(tab==='tarjeta'){
  const to=S.to.trim(),m=curMsg().trim();
  if(!to){seg.tarjeta='mensaje';renderRight();$('errTo').textContent=t('errTo');$('fTo').focus();sfx('err');return}
  if(!m){seg.tarjeta='mensaje';renderRight();$('errMsg').textContent=t('errMsg');$('fMsg').focus();sfx('err');return}
  S.code=enc(giftObj(mkGift()));S.mode='sent';save();sfx('ding');go('enviar');return;
 }
 askAnother();
};
const toggleDev=()=>{document.body.classList.toggle('dev');try{localStorage.setItem('keptly_dev',document.body.classList.contains('dev')?'1':'')}catch(e){}};
try{if(localStorage.getItem('keptly_dev'))document.body.classList.add('dev')}catch(e){}
$('secName').ondblclick=toggleDev;
document.addEventListener('keydown',e=>{
 if(ST.on){
  if(e.key==='Escape'){e.preventDefault();stAskClose();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?stRedo():stUndo()}
  return;
 }
 if(e.key==='Escape'){closeMenu();closeDlg();return}
 if(e.target.matches('input,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key.toLowerCase();
 if(k==='d'&&e.shiftKey){toggleDev();return}
 if(k==='u'){toggleUI();return}
 if(tab==='vivero'&&S.mode==='grow'){const m={1:'w',2:'l',3:'a',4:'c',r:'w',s:'l',h:'a',c:'c'}[k];if(m){e.preventDefault();act(m)}}
});
document.body.appendChild($('env'));
$('openCard').onclick=()=>{$('env').classList.add('on');sfx('paper');const x=$('env').querySelector('.envx');if(x)x.focus({preventScroll:true})};
$('env').addEventListener('click',e=>{if(e.target.id==='env'||e.target.closest('.envx')){$('env').classList.remove('on');$('openCard').focus({preventScroll:true})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('env').classList.contains('on'))$('env').classList.remove('on')});
$('replay').onclick=()=>playFlip();
$('plantOwn').onclick=()=>{if(S.mode==='sent'){const x=S.test;S=fresh();S.test=x}S.seen=true;save();location.hash='tienda'};
window.addEventListener('hashchange',route);
window.addEventListener('resize',stFit);
window.addEventListener('pointerdown',()=>{if(SND)ac()},{once:true,passive:true});

/* boot */
(function(){
 let l='';try{l=localStorage.getItem('keptly_lang')||''}catch(e){}
 if(l!=='es'&&l!=='en')l=((navigator.language||'es').toLowerCase().startsWith('es'))?'es':'en';
 LANG=l;
})();
route();startTimer();

/* ---------- drag the tag anywhere on the pile ---------- */
(function(){
 const tg=$('pileTag');if(!tg)return;let d=null,hinted=false;
 const pile=()=>$('pile');
 const canDrag=()=>tab==='tarjeta'&&S.mode==='card'&&tg.classList.contains('on');
 tg.addEventListener('pointerdown',e=>{
  if(!canDrag())return;
  const r=pile().getBoundingClientRect(),t0=tg.getBoundingClientRect();
  d={id:e.pointerId,dx:e.clientX-t0.left,dy:e.clientY-t0.top,r};tg.setPointerCapture(e.pointerId);tg.classList.add('drag');e.preventDefault();sfx('tap');
 });
 tg.addEventListener('pointermove',e=>{
  if(!d||e.pointerId!==d.id)return;
  const x=clamp((e.clientX-d.dx-d.r.left)/d.r.width*100,-15,90),y=clamp((e.clientY-d.dy-d.r.top)/d.r.height*100,-5,92);
  S.gx=x;S.gy=y;tg.style.left=x+'%';tg.style.top=y+'%';tg.style.bottom='auto';
 });
 const end=e=>{if(!d)return;d=null;tg.classList.remove('drag');save();sfx('pop')};
 tg.addEventListener('pointerup',end);tg.addEventListener('pointercancel',end);
 new MutationObserver(()=>{const w=canDrag();if(w&&!tg.classList.contains('can')){tg.classList.add('can');if(!hinted){hinted=true;toast(t('dragTag'))}}else if(!w&&tg.classList.contains('can'))tg.classList.remove('can')}).observe(tg,{attributes:true,attributeFilter:['class']});
})();

;(function(){
 const sd=$('pileSeed'),pile=$('pile');if(!sd)return;let d=null;
 const cq=()=>pile.clientWidth/100;
 const over=()=>{const r=sd.getBoundingClientRect(),q=pile.getBoundingClientRect(),k=cq();const x=(r.left+r.width/2-q.left)/k,y=(r.top+r.height/2-q.top)/k;return Math.abs(x-50)<22&&y>64&&y<86};
 const sow=()=>{if(S.sow!==false)return;const q=pile.getBoundingClientRect(),r=sd.getBoundingClientRect(),k=cq();
  const dx=q.left+50*k-(r.left+r.width/2),dy=q.top+75*k-(r.top+r.height/2),cur=sd.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
  const bx=cur?+cur[1]:0,by=cur?+cur[2]:0;
  sd.classList.remove('drag','back');sd.classList.add('sowing');sd.style.transform='translate('+(bx+dx)+'px,'+(by+dy)+'px) scale(.35)';
  S.sow=true;save();sfx('grow');
  setTimeout(()=>{say(t('sown'));render(true)},380)};
 sd.addEventListener('pointerdown',e=>{if(S.sow!==false)return;e.preventDefault();sd.setPointerCapture(e.pointerId);d={x:e.clientX,y:e.clientY,moved:false};sd.classList.add('drag');sd.classList.remove('back')});
 sd.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.abs(dx)+Math.abs(dy)>6)d.moved=true;sd.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12) rotate('+(dx*.1)+'deg)'});
 const end=()=>{if(!d)return;const was=d;d=null;const ok=!was.moved||over();if(ok)sow();else{sd.classList.remove('drag');sd.classList.add('back');sd.style.transform='';sfx('err');say(t('sowHint'))}};
 sd.addEventListener('pointerup',end);sd.addEventListener('pointercancel',()=>{if(d){d=null;sd.classList.remove('drag');sd.classList.add('back');sd.style.transform=''}});
 sd.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();sow()}});
})();

;(function(){const b=document.querySelector('.bottom');if(!b||!window.ResizeObserver)return;const set=()=>document.documentElement.style.setProperty('--bh',Math.ceil(b.getBoundingClientRect().height)+'px');set();new ResizeObserver(set).observe(b)})();
}
</script>
